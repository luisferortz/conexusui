<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Semáforos IoT</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- Script de protección de ruta -->
  <script>
    if (sessionStorage.getItem('auth') !== 'true') {
      window.location.href = 'index.html';
    }
  </script>
</head>
<body>

  <header style="width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
    <h1 style="margin-bottom: 0;">Dashboard de Control</h1>
    <button id="logoutBtn" style="margin-top: 0; padding: 0.5rem 1rem;">Cerrar Sesión</button>
  </header>

  <main style="width: 100%; max-width: 1000px;">
    <h2>Intersecciones Semafóricas</h2>
    <p style="margin-top: 1rem; color: #888888;">Aquí conectarás la librería MQTT para visualizar y controlar las 4 ESP32.</p>
  </main>

  <script>
    // Botón para cerrar sesión y destruir la clave guardada
    document.getElementById('logoutBtn').addEventListener('click', function() {
      sessionStorage.removeItem('auth');
      window.location.href = 'index.html';
    });
  </script>

</body>
</html>
